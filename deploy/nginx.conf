# /etc/nginx/sites-available/geoagent
# Everything — dashboard and API — comes from the single geoagent-api service.
#   certbot --nginx -d geoagent.example.com

upstream geoagent { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    server_name geoagent.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geoagent.example.com;

    ssl_certificate     /etc/letsencrypt/live/geoagent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoagent.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # run progress stream — buffering would hold the events back
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://geoagent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # run previews are immutable once written
    location ~ ^/api/runs/[^/]+/preview/ {
        proxy_pass http://geoagent;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # hashed build assets
    location /_next/static/ {
        proxy_pass http://geoagent;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://geoagent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # Earth Engine downloads are slow
        proxy_send_timeout 900s;
    }
}
